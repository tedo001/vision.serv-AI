[project]
name = "ai-vision-platform"
version = "0.1.0"
description = "AI-powered computer vision platform for workplace safety, security, compliance, productivity, and operational monitoring."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/*/__init__.py"]
