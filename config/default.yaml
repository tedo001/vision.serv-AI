# ============================================================================
# AI Vision Platform - Default Configuration
# ----------------------------------------------------------------------------
# This file is the single source of runtime configuration. It is loaded and
# validated at startup into a typed AppConfig object (app/config/settings.py).
# Rename the product, switch profiles, or tune inference here -- no code edits.
# ============================================================================

# Product identity. Change this single value to rebrand the application.
product_name: "AI Vision Platform"

# Which industry profile is active on launch. Profiles bundle the AI modules,
# rules, dashboard, and alert policies for a vertical (Phase 6).
active_profile: "construction"

# Persistence and output locations.
database_path: "vision_platform.db"
screenshot_dir: "screenshots"
report_dir: "reports"

logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_dir: "logs"
  max_bytes: 5242880     # 5 MB before rotation
  backup_count: 5
  console: true

ui:
  theme: "clam"          # ttk theme name
  window_title: "AI Vision Platform"
  width: 1440
  height: 900

# Global inference defaults. Individual profiles/plugins may override.
detection:
  confidence: 0.45       # minimum confidence to keep a detection [0-1]
  iou: 0.50              # NMS IoU threshold [0-1]
  device: "auto"         # auto | cpu | cuda | cuda:0
  model_dir: "assets/models"

# Defaults applied to every camera unless overridden per-camera (Phase 7).
camera:
  reconnect_seconds: 5.0
  target_fps: 25
  buffer_size: 1         # 1 = lowest latency (drop stale frames)

alert:
  enable_sound: true
  sound_file: "assets/sounds/alert.wav"
  min_severity: "medium" # info | low | medium | high | critical
